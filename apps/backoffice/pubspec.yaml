name: backoffice
description: Race Direction backoffice for the race direction staff.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  blocs:
    path: ../../packages/blocs
  domain:
    path: ../../packages/domain
  flutter_bloc: ^9.1.1
  go_router: 18.0.2

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
